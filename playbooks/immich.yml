- hosts: g4
  become: true
  roles:
    - geerlingguy.docker
  tasks:
    - name: Ensure weekly Immich backup cron exists for dzhus (Monday 04:00)
      cron:
        name: nightly immich backup
        user: dzhus
        minute: "0"
        hour: "4"
        weekday: "1"
        job: >-
          cd ~dzhus/immich &&
          backup_name="backup-$(date --iso-8601=date).tar" &&
          tmp_backup="$(mktemp /tmp/immich-backup-XXXXXXXXXX.tar)" &&
          tar cf "$tmp_backup" library/upload/ library/profile/ library/library/ library/backups/$(ls library/backups | tail -n1) &&
          mkdir -p ~dzhus/Sync/immich-backups &&
          cp "$tmp_backup" ~dzhus/Sync/immich-backups/"$backup_name" &&
          (cd ~dzhus/Sync/immich-backups && ls -1t backup-*.tar 2>/dev/null | tail -n +8 | xargs -r rm -f) &&
          rm -f "$tmp_backup"

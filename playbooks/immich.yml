- hosts: g4
  become: true
  roles:
    - geerlingguy.docker
  tasks:
    - name: Ensure nightly Immich backup cron exists for dzhus
      cron:
        name: nightly immich backup
        user: dzhus
        minute: "0"
        hour: "4"
        job: >-
          cd ~dzhus/immich &&
          backup_name="backup-$(date --iso-8601=date).tar" &&
          tar cf "$backup_name" library/upload/ library/profile/ library/library/ library/backups/$(ls library/backups | tail -n1) &&
          mkdir -p ~dzhus/Sync/immich-backups &&
          cp "$backup_name" ~dzhus/Sync/immich-backups/ &&
          (cd ~dzhus/Sync/immich-backups && ls -1t backup-*.tar 2>/dev/null | tail -n +8 | xargs -r rm -f) &&
          rm -f "$backup_name"
